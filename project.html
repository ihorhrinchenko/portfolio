    <link rel="stylesheet" href="/css/styles.css" />
    <script>
      (() => {
        try {
          const navigation_entry = window.performance?.getEntriesByType?.('navigation')?.[0];
          if (navigation_entry?.type === 'reload' && 'scrollRestoration' in window.history) {
            window.history.scrollRestoration = 'manual';
          }
          const saved_theme = localStorage.getItem('portfolio_theme');
          const preferred_theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = saved_theme || preferred_theme;
          const saved_language = localStorage.getItem('portfolio_language');
          document.documentElement.lang = saved_language === 'de' ? 'de' : 'en';
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>

    <a class="skip_link" href="#main_content" data-i18n="a11y.skip_link">Skip to content</a>
    <header class="site_header">
      <div class="header_inner page_container">
        <a class="wordmark" href="/" aria-label="Ihor Hrinchenko — home" data-i18n-aria-label="brand.home"><span class="wordmark_mark" aria-hidden="true">ih.</span><span class="wordmark_name">Ihor Hrinchenko</span></a>
        <nav class="desktop_nav" aria-label="Main navigation" data-i18n-aria-label="a11y.main_nav">

        </nav>
        <div class="header_controls">
        <div class="language_switcher" role="group" aria-label="Choose language" data-i18n-aria-label="a11y.choose_language"><button class="language_button" type="button" lang="en" aria-label="English" data-i18n-aria-label="learning.language_english" data-language="en" aria-pressed="true">EN</button><span class="language_divider" aria-hidden="true">/</span><button class="language_button" type="button" lang="de" aria-label="German" data-i18n-aria-label="learning.language_german" data-language="de" aria-pressed="false">DE</button></div>
          <button class="theme_toggle icon_button" id="theme_toggle" type="button" aria-label="Switch to dark theme"><svg class="theme_icon_sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg><svg class="theme_icon_moon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M20.5 14.2A8.8 8.8 0 0 1 9.8 3.5 8.8 8.8 0 1 0 20.5 14.2Z"/></svg></button>
          <button class="mobile_menu_toggle icon_button" id="menu_toggle" type="button" aria-controls="mobile_nav" aria-expanded="false" aria-label="Open navigation menu"><svg class="menu_icon_open" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><svg class="menu_icon_close" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
      </div>
      <nav class="mobile_nav page_container" id="mobile_nav" aria-label="Mobile navigation" data-i18n-aria-label="a11y.mobile_nav" hidden>
        <a href="/#about_section" data-i18n="nav.about">About</a><a href="/#projects_section" data-i18n="nav.projects">Projects</a><a href="/#experience_section" data-i18n="nav.experience">Experience</a><a href="/#skills_section" data-i18n="nav.skills">Skills</a><a href="/#contact_section" data-i18n="nav.contact">Contact</a>
